<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>핫딜모아 관리자</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f4f6;color:#191f28;font:15px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif}main{max-width:760px;margin:auto;padding:24px 24px 40px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}h1{font-size:27px;letter-spacing:-1.2px;margin:0;font-weight:800}h2{font-size:22px;letter-spacing:-.7px;margin:0 0 8px}button,input,select,textarea{font:inherit;border:0;border-radius:12px;padding:12px 14px;color:inherit;min-width:0}input,select,textarea{background:#f2f4f6}button{cursor:pointer;background:#e8f3ff;color:#1768c5;font-weight:700}button.primary,a.buy{background:#3182f6;color:white}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #3182f6;outline-offset:2px}a.buy{display:block;text-align:center;padding:13px;border-radius:12px;text-decoration:none;font-weight:700;clear:both;margin-top:18px}.hero{margin:24px 0 12px;padding:0}.hero a{color:#1768c5}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}.filters input{flex:1;min-width:140px}.filters input,.filters select{background:white}.grid{display:grid;grid-template-columns:1fr;gap:12px}.card,form{background:white;padding:22px;border-radius:20px}.card h3{margin:8px 0;font-size:17px;line-height:1.55;letter-spacing:-.35px}.card p{margin:7px 0;color:#4e5968;overflow-wrap:anywhere}.pic{width:104px;aspect-ratio:1;object-fit:contain;background:#f2f4f6;border-radius:14px;float:right;margin:0 0 10px 14px}.price{font-size:25px;font-weight:800;letter-spacing:-.8px}.red{color:#f04452}.price small{font-size:13px;font-weight:500;color:#4e5968;letter-spacing:0}small,del{color:#6b7684}form{display:grid;gap:14px;margin:15px 0}label{display:grid;gap:6px;font-weight:600}label input,label textarea,label select{width:100%;font-weight:400}label input[type=checkbox]{width:auto;accent-color:#3182f6}footer{color:#6b7684;margin:24px 0;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}#msg{color:#1768c5;font-size:13px}#msg:empty{display:none}#msg:not(:empty){padding:14px;background:#e8f3ff;border-radius:12px;overflow-wrap:anywhere}button:disabled{opacity:.55;cursor:wait}[hidden]{display:none!important}.notice{font-size:12px;color:#596575;line-height:1.65;margin:0 0 12px}.copy{width:100%;margin-top:8px;background:#f2f4f6;color:#4e5968}.empty{padding:30px;text-align:center;color:#6b7684}@media(max-width:480px){main{padding:20px 16px 32px}.card,form{padding:18px}h1{font-size:24px}.filters input{flex-basis:100%}.filters select{flex:1}.pic{width:84px}.price{font-size:23px}}.chips{display:flex;flex-wrap:wrap;gap:7px}.chips button{padding:8px 12px;background:#f2f4f6;color:#4e5968}.chips button.active{background:#3182f6;color:white}.imageStatus{font-size:12px;color:#6b7684}details summary{cursor:pointer;color:#6b7684}details label{margin-top:8px}.freshBadge{color:#087b42;background:#e7f7ed;border-radius:7px;padding:3px 7px;align-self:flex-start;font-weight:700}.freshToggle{background:#e7f7ed;color:#087b42;padding:10px;border-radius:10px}</style><main><header><h1>핫딜모아 관리자</h1><button id="login">GitHub 인증</button></header><p class="notice">*본 사이트는 쿠팡 파트너스, 토스 등 제휴 마케팅 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받을 수 있습니다.</p><section class="hero"><h2>관리자 전용</h2>GitHub 인증 후 상품을 관리하세요. <a href="./index.html">공개 홈페이지 보기</a></section><form id="authForm"><label>GitHub 저장소 (사용자명/저장소명)<input id="repoInput" required placeholder="myid/hotdeal" autocomplete="off"></label><label>브랜치<input id="branchInput" required value="main"></label><label>인증 토큰<input id="tokenInput" type="password" required autocomplete="off"></label><label><span><input type="checkbox" id="remember"> 이 개인 기기에서 자동 로그인</span></label><small>선택하면 인증 토큰이 이 브라우저에 저장됩니다. 공용 기기에서는 선택하지 마세요.</small><button class="primary" type="submit">인증 및 연결</button></form><p id="msg" role="status" aria-live="polite"></p><noscript>JavaScript를 활성화해야 인증할 수 있습니다.</noscript><section id="admin" hidden><h2>상품 관리</h2><form id="form"><input name="id" type="hidden"><label>쇼핑몰<select name="shop"><option>쿠팡</option><option>네이버</option><option>토스</option><option>기타</option></select></label><label class="freshToggle"><span><input type="checkbox" name="fresh"> 🥬 로켓프레시 전용 상품</span></label><label>상품명<input name="name" required></label><label>핫딜 가격<input name="price" type="number" min="0" required></label><label>평소 가격 (자유 입력)<input name="normal" placeholder="2.4만대"></label><label>수량 (개당 가격 자동 계산)<input name="qty" type="number" min="1" step="1"></label><label>핫딜 코멘트<input name="comment" placeholder="선택 또는 직접 입력"></label><div id="chips" class="chips"></div><label>구매 링크<input name="link" type="url" required></label><input name="image" type="hidden"><div id="imageStatus" aria-live="polite" class="imageStatus">구매 링크에서 상품 사진을 자동 확인합니다.</div><img id="previewImage" class="pic" hidden alt="상품 사진 미리보기"><details><summary>추가 관리 옵션</summary><label><span><input type="checkbox" name="pinned"> 상단 고정</span></label><label><span><input type="checkbox" name="ended"> 할인 종료</span></label></details><button class="primary">저장 및 공개</button><button type="reset">입력 초기화</button></form><button id="backup">JSON 백업</button></section><div class="filters" hidden><input id="search" placeholder="상품 검색"><select id="shop"><option>전체</option><option>쿠팡</option><option value="fresh">🥬 로켓프레시</option><option>네이버</option><option>토스</option><option>기타</option></select><select id="sort"><option value="new">최신순</option><option value="low">낮은 가격순</option><option value="discount">할인율순</option></select></div><div id="list" class="grid" hidden></div></main><script>
const $=s=>document.querySelector(s);let key='',deals=[];const msg=s=>$('#msg').textContent=s;const money=n=>Number(n).toLocaleString('ko-KR')+'원';const discount=d=>d.original>d.price?Math.round((1-d.price/d.original)*100):0;const safe=s=>{try{return ['http:','https:'].includes(new URL(s).protocol)}catch{return false}};let repo='',branch='main',sha='';const endpoint=()=>`https://api.github.com/repos/${repo}/contents/deals.json`;async function gh(url,options={}){const r=await fetch(url,{signal:AbortSignal.timeout(20000),...options,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+key,'Content-Type':'application/json'}});const x=await r.json();if(!r.ok)throw Error('HTTP '+r.status+' · '+(x.message||'GitHub 요청 실패'));return x}async function readAdmin(){const x=await gh(endpoint()+'?ref='+encodeURIComponent(branch));sha=x.sha;deals=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(x.content),c=>c.charCodeAt(0))));}async function api(path,method='GET',data){if(path==='auth'){const r=await gh('https://api.github.com/repos/'+repo);if(r.permissions && !r.permissions.push)throw Error('저장소 수정 권한이 없습니다');await readAdmin();return}if(method==='GET'){if(key){await readAdmin();return deals}const r=await fetch('./deals.json',{cache:'no-store'});if(!r.ok)throw Error('상품 파일을 찾을 수 없습니다');return r.json()}await readAdmin();let next;if(method==='DELETE')next=deals.filter(d=>d.id!==path.split('/').pop());else{const id=data.id||crypto.randomUUID();next=[{...data,id},...deals.filter(d=>d.id!==id)]}const bytes=new TextEncoder().encode(JSON.stringify(next,null,2));let binary='';for(const byte of bytes)binary+=String.fromCharCode(byte);const saved=await gh(endpoint(),{method:'PUT',body:JSON.stringify({message:'핫딜 상품 업데이트',content:btoa(binary),sha,branch})});await readAdmin();try{localStorage.setItem('hotdealUpdated',String(Date.now()))}catch{};if(sha!==saved.content.sha)throw Error('저장 후 다른 변경이 감지되었습니다. 목록을 확인하세요.');return deals}async function load(){try{deals=await api('deals');render()}catch(e){msg('데이터 연결 실패: '+e.message)}}function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}function button(text,fn){const b=el('button',text);b.onclick=fn;return b}async function copyDeal(d){const notice=d.shop==='쿠팡'?'*이 게시물은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.':'*이 게시물은 제휴 마케팅 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받을 수 있습니다.';const detail=[d.normal?'평소가 '+d.normal:d.original>0?'평소가 '+money(d.original):'',d.comment].filter(Boolean).join(' / ');const text=[notice,'','✅ '+d.name,'👉🏻 '+d.price+'원'+(Number(d.qty)>0?' (개당 '+Math.round(d.price/d.qty)+'원)':''),detail?'└ '+detail:'','',d.link].filter((v,i)=>v||i===1).join('\n');try{await navigator.clipboard.writeText(text);msg('복사 완료');}catch{window.prompt('아래 문구를 직접 복사하세요',text)}}function render(){const q=$('#search').value.toLowerCase(),s=$('#shop').value,sort=$('#sort').value;let ds=deals.filter(d=>(s==='전체'||(s==='fresh'?!!d.fresh:d.shop===s))&&d.name.toLowerCase().includes(q));ds.sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned)||(sort==='low'?a.price-b.price:sort==='discount'?discount(b)-discount(a):0));const list=$('#list');list.replaceChildren();if(!ds.length)list.append(el('p','등록된 상품이 없습니다','empty'));for(const d of ds){const c=el('article',undefined,'card');if(safe(d.image)){const im=el('img',undefined,'pic');im.src=d.image;im.alt=d.name;im.loading='lazy';im.onerror=()=>im.remove();c.append(im)}c.append(el('small',d.fresh?'🥬 로켓프레시'+(d.pinned?' · 추천':''):d.shop+(d.pinned?' · 추천':''),d.fresh?'freshBadge':''),el('h3','✅ '+d.name));const pr=el('div','👉🏻 '+money(d.price),'price red');if(Number(d.qty)>0)pr.append(el('small',' (개당 '+money(Math.round(d.price/d.qty))+')'));c.append(pr);const detail=[d.normal?'평소가 '+d.normal:d.original>0?'평소가 '+money(d.original):'',d.comment].filter(Boolean).join(' / ');if(detail)c.append(el('p','└ '+detail));if(d.ended)c.append(el('p','할인 종료','red'));else if(safe(d.link)){const a=el('a','구매하러 가기','buy');a.href=d.link;a.target='_blank';a.rel='noopener noreferrer sponsored';c.append(a);const b=button('복사하기',()=>copyDeal(d));b.className='copy';c.append(b)}if(key){const a=el('div',undefined,'actions');a.append(button('수정',()=>{$('#form').reset();for(const [k,v] of Object.entries(d)){const f=$('#form').elements.namedItem(k);if(f){if(f.type==='checkbox')f.checked=!!v;else f.value=v??''}}syncChips();showImage();$('#form').scrollIntoView()}),button('삭제',async()=>{if(confirm('삭제할까요?'))try{await api('deals/'+d.id,'DELETE');await load()}catch(e){msg(e.message)}}));c.append(a)}list.append(c)}}$('#login').onclick=()=>{if(key){try{localStorage.removeItem('hotdealAuthV6')}catch{};key='';$('#admin').hidden=true;$('.filters').hidden=true;$('#list').hidden=true;deals=[];$('#list').replaceChildren();$('#form').reset();$('#authForm').hidden=false;$('#login').textContent='GitHub 인증';msg('로그아웃 완료')}else{$('#repoInput').focus();msg('아래 인증 정보를 입력하세요')}};try{ $('#repoInput').value=localStorage.getItem('hotdealRepo')||'' }catch{};if(!$('#repoInput').value&&location.hostname.endsWith('.github.io')){const owner=location.hostname.split('.')[0],project=location.pathname.split('/').filter(Boolean)[0];$('#repoInput').value=owner+'/'+(project&&project!=='admin.html'?project:owner+'.github.io')}$('#authForm').onsubmit=async e=>{e.preventDefault();const r=$('#repoInput').value.trim();if(!/^[\w.-]+\/[\w.-]+$/.test(r)){msg('저장소를 사용자명/저장소명 형식으로 입력하세요.');return}repo=r;branch=$('#branchInput').value.trim();key=$('#tokenInput').value.trim();if(!key){msg('인증 토큰을 입력하세요.');return}const btn=e.target.querySelector('button');btn.disabled=true;$('#login').disabled=true;msg('GitHub 인증 중…');try{await api('auth','POST');render();$('#admin').hidden=false;$('.filters').hidden=false;$('#list').hidden=false;$('#authForm').hidden=true;$('#tokenInput').value='';$('#login').textContent='로그아웃';try{localStorage.setItem('hotdealRepo',repo);if($('#remember').checked)localStorage.setItem('hotdealAuthV6',JSON.stringify({repo,branch,key}));else localStorage.removeItem('hotdealAuthV6')}catch{}msg('관리자 연결 완료 · '+repo+' / '+branch+' · 공개 사이트와 동일한 저장소 및 브랜치인지 확인하세요')}catch(err){key='';try{localStorage.removeItem('hotdealAuthV6')}catch{};msg('인증 실패: '+err.message+' · 저장소 이름, 브랜치, 토큰 권한 및 deals.json 파일을 확인하세요.')}finally{btn.disabled=false;$('#login').disabled=false}};$('#form').onsubmit=async e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));if(!safe(d.link)||(d.image&&!safe(d.image))){msg('HTTP 또는 HTTPS 링크를 입력하세요');return}d.price=Number(d.price);d.original=0;const old=deals.find(x=>x.id===d.id);if(old&&old.normal===d.normal)d.original=Number(old.original||0);d.qty=Number(d.qty||0);d.fresh=f.elements.fresh.checked;d.pinned=f.elements.pinned.checked;d.ended=f.elements.ended.checked;const save=f.querySelector('button.primary');save.disabled=true;msg('GitHub 저장 중…');try{await lookupImage();d.image=f.elements.image.value;await api('deals','POST',d);f.reset();f.elements.id.value='';syncChips();showImage();render();msg('GitHub 저장 및 확인 완료 · '+repo+' / '+branch+' · 공개 페이지 자동 갱신 대기 중')}catch(e){msg('저장 실패: '+e.message)}finally{save.disabled=false}};$('#backup').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(deals,null,2)],{type:'application/json'}));a.download='hotdeal-backup.json';a.click();URL.revokeObjectURL(a.href)};for(const s of ['#search','#shop','#sort'])$(s).oninput=render;try{const saved=JSON.parse(localStorage.getItem('hotdealAuthV6')||'null');if(saved?.key){$('#repoInput').value=saved.repo;$('#branchInput').value=saved.branch;$('#tokenInput').value=saved.key;$('#remember').checked=true;$('#authForm').requestSubmit()}}catch{};
const form=$('#form'), comment=form.elements.comment, linkField=form.elements.link, imageField=form.elements.image;
for(const value of ['대박🔥🔥🔥','역대급🔥','가격 좋아요👍','쟁여두세요','강추❤️','없음']){const b=button(value,()=>{comment.value=value==='없음'?'':value;syncChips()});b.type='button';b.dataset.value=value==='없음'?'':value;$('#chips').append(b)}
function syncChips(){for(const b of $('#chips').children){const active=b.dataset.value===comment.value;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))}}
comment.addEventListener('input',syncChips);syncChips();
function showImage(){const im=$('#previewImage');im.hidden=!safe(imageField.value);if(!im.hidden)im.src=imageField.value;else im.removeAttribute('src');$('#imageStatus').textContent=im.hidden?'사진 없음 · 링크에서 자동 확인 가능':'상품 사진 확인 완료';im.onerror=()=>{im.hidden=true;$('#imageStatus').textContent='사진을 표시할 수 없습니다. 상품은 등록 가능합니다.'}}
let pending=null, pendingLink='', generation=0;
async function lookupImage(){const url=linkField.value.trim();if(!safe(url))return;if(safe(imageField.value))return;if(pending&&pendingLink===url)return pending;const g=++generation;pendingLink=url;$('#imageStatus').textContent='상품 사진 확인 중…';pending=(async()=>{try{const r=await fetch(url,{credentials:'omit',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error();const doc=new DOMParser().parseFromString(await r.text(),'text/html');const raw=doc.querySelector('meta[property="og:image"],meta[name="twitter:image"]')?.content;if(!raw)throw Error();const img=new URL(raw,r.url).href;if(!safe(img))throw Error();if(g===generation&&linkField.value.trim()===url){imageField.value=img;showImage()}}catch{if(g===generation)$('#imageStatus').textContent='쇼핑몰 이미지 조회 제한 · 사진 없이 등록됩니다.'}finally{if(g===generation)pending=null}})();return pending}
linkField.addEventListener('input',()=>{generation++;pending=null;imageField.value='';showImage()});linkField.addEventListener('change',lookupImage);form.addEventListener('reset',()=>{generation++;pending=null;setTimeout(()=>{syncChips();showImage()},0)});
</script></html>
