button></section><p id="msg" role="status"></p><div id="announcement" hidden></div><div id="newCount"></div><div class="filters"><input id="search" placeholder="상품 검색" list="suggestions"><datalist id="suggestions"></datalist><button id="history">최근 검색</button><button id="layout">1열 보기</button><button id="font">글씨 크기</button><button id="shopping">쇼핑 목록</button><div class="tabs" id="tabs" aria-label="핫딜 분류"><button type="button" data-filter="전체" aria-pressed="true">전체</button><button type="button" data-filter="쿠팡" aria-pressed="false">쿠팡</button><button type="button" data-filter="fresh" aria-pressed="false">🥬로켓프레시</button><button type="button" data-filter="토스" aria-pressed="false">토스</button><button type="button" data-filter="이벤트" aria-pressed="false">이벤트</button></div><input type="hidden" id="shop" value="전체"><select id="sort"><option value="new">최신순</option><option value="low">낮은 가격순</option><option value="high">높은 가격순</option><option value="recommend">추천순</option><option value="manual">지정 순서</option></select></div><div id="list" class="grid"></div></main><script>function estimate(v){let s=String(v||'').replace(/[ ,원대]/g,'');let m=s.match(/^(\d+(?:\.\d+)?)(만|천)?$/);return m?Number(m[1])*(m[2]==='만'?10000:m[2]==='천'?1000:1):0}function localGet(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function localSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
const $=s=>document.querySelector(s);let deals=[];const msg=s=>$('#msg').textContent=s;const money=n=>Number(n).toLocaleString('ko-KR')+'원';const discount=d=>d.original>d.price?Math.round((1-d.price/d.original)*100):0;const safe=s=>{try{return ['http:','https:'].includes(new URL(s).protocol)}catch{return false}};let busy=false,lastData='';const parts=location.pathname.split('/').filter(Boolean);const owner=location.hostname.endsWith('.github.io')?location.hostname.slice(0,-10):'';const project=parts[0]&&!parts[0].endsWith('.html')?parts[0]:owner+'.github.io';const live=owner?'https://api.github.com/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(project)+'/contents/deals.json?ref=main':'';async function load(){if(busy)return;busy=true;try{let next;if(live){try{const r=await fetch(live,{cache:'no-cache',headers:{Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(8000)});if(!r.ok)throw Error('API '+r.status);const x=await r.json();next=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(x.content),c=>c.charCodeAt(0))));if(!Array.isArray(next))throw Error('데이터 형식 오류')}catch(e){/* fall back to Pages */}}if(!next){const r=await fetch('./deals.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('상품 파일을 찾을 수 없습니다');next=await r.json()}if(!Array.isArray(next))throw Error('상품 데이터 형식 오류');const serialized=JSON.stringify(next);if(serialized!==lastData){lastData=serialized;deals=next.filter(d=>!d.deletedAt&&d.shop!=="__settings");const settings=next.find(d=>d.shop==="__settings");applySettings(settings);render()}if($('#msg').textContent.startsWith('데이터 연결 실패'))msg('')}catch(e){msg('데이터 연결 실패: '+e.message+' · 잠시 후 다시 확인합니다')}finally{busy=false}}function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}function button(text,fn){const b=el('button',text);b.onclick=fn;return b}async function copyDeal(d){if(d.shop==='이벤트'){const t=['*제휴 링크가 포함될 수 있습니다.',d.name,d.description,d.link].filter(Boolean).join('\n');try{await navigator.clipboard.writeText(t);msg('복사 완료')}catch{window.prompt('복사하세요',t)}return;}const notice=d.shop==='쿠팡'?'*이 게시물은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.':'*이 게시물은 제휴 마케팅 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받을 수 있습니다.';const detail=[d.normal?'평소가 '+d.normal:d.original>0?'평소가 '+money(d.original):'',d.comment].filter(Boolean).join(' / ');const text=[notice,'','✅ '+d.name,'👉🏻 '+d.price+'원'+(Number(d.qty)>0?' (개당 '+Math.round(d.price/d.qty)+'원)':''),detail?'└ '+detail:'','',d.link].filter((v,i)=>v||i===1).join('\n');try{await navigator.clipboard.writeText(text);msg('복사 완료');}catch{window.prompt('아래 문구를 직접 복사하세요',text)}}function age(t){const m=Math.max(0,Math.floor((Date.now()-Date.parse(t))/60000));return m<1?'방금 전':m<60?m+'분 전':m<1440?Math.floor(m/60)+'시간 전':Math.floor(m/1440)+'일 전'}let favorites=new Set();try{favorites=new Set(JSON.parse(localStorage.getItem('hotdealFavorites')||'[]'))}catch{}let onlyFav=false;$('#favorites').onclick=()=>{onlyFav=!onlyFav;$('#favorites').setAttribute('aria-pressed',String(onlyFav));render()};function imageSafe(v){return safe(v)||/^data:image\/(?:jpeg|webp|png);base64,[A-Za-z0-9+/=]+$/.test(v||'')}function render(){const q=$('#search').value.toLowerCase(),s=$('#shop').value,sort=$('#sort').value;let ds=deals.filter(d=>(s==='전체'||(s==='fresh'?!!d.fresh:s==='쿠팡'?d.shop==='쿠팡'&&!d.fresh:d.shop===s))&&d.name.toLowerCase().includes(q));if(onlyFav)ds=ds.filter(d=>favorites.has(d.id));ds.sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned)||(sort==='low'?a.price-b.price:sort==='high'?b.price-a.price:sort==='manual'?0:(Date.parse(b.createdAt)||0)-(Date.parse(a.createdAt)||0)));const list=$('#list');list.replaceChildren();if(!ds.length)list.append(el('p','등록된 상품이 없습니다','empty'));let recommended=false,regular=false;for(const d of ds){if(d.pinned&&!recommended){list.append(el('h2','🔥 오늘의 추천 핫딜','recommendTitle'));recommended=true}if(!d.pinned&&recommended&&!regular){list.append(el('h2','전체 핫딜','recommendTitle'));regular=true}const c=el('article',undefined,'card');c.dataset.dealId=String(d.id);if(imageSafe(d.image)){const im=el('img',undefined,'pic');im.src=d.image;im.alt=d.name;im.loading='lazy';im.onerror=()=>im.remove();c.append(im)}c.append(el('small',d.fresh?'🥬 로켓프레시'+(d.pinned?' · 추천':''):d.shop+(d.pinned?' · 추천':''),d.fresh?'freshBadge':''),el('h3','✅ '+d.name));if(d.createdAt)c.append(el('small',age(d.createdAt))); if(d.shop==='이벤트'){c.classList.add('eventCard');if(d.eventType)c.append(el('small',d.eventType));if(d.start||d.end)c.append(el('p',[d.start,d.end].filter(Boolean).join(' ~ ')));if(d.method)c.append(el('p','참여 방법: '+d.method));if(d.description)c.append(el('p',d.description,'eventBody'));}else{const pr=el('div','👉🏻 '+money(d.price),'price red');if(Number(d.qty)>0)pr.append(el('small',' (개당 '+money(Math.round(d.price/d.qty))+')'));c.append(pr);const base=estimate(d.normal);if(base>d.price&&d.price>=0)c.append(el("small",`평소가 대비 약 ${Math.round((1-d.price/base)*100)}% · 약 ${money(base-d.price)} 절약`,"red"));const detail=[d.normal?'평소가 '+d.normal:d.original>0?'평소가 '+money(d.original):'',d.comment].filter(Boolean).join(' / ');if(detail)c.append(el('p','└ '+detail));}if(d.ended||(d.shop==='이벤트'&&((d.end&&d.end<today())||(d.start&&d.start>today()))))c.append(el('p','할인 종료','red'));else if(safe(d.link)){const a=el('a',d.shop==='이벤트'?'이벤트 자세히 보기':'특가 확인하기','buy');a.href=d.link;a.addEventListener("click",()=>{const x=localGet("hdClicks",{});x[d.id]=(x[d.id]||0)+1;localSet("hdClicks",x)});a.target='_blank';a.rel='noopener noreferrer sponsored';c.append(a);const b=button('복사하기',()=>copyDeal(d));b.className='copy';c.append(b)}const h=button(favorites.has(d.id)?'♥':'♡',()=>{favorites.has(d.id)?favorites.delete(d.id):favorites.add(d.id);try{localStorage.setItem('hotdealFavorites',JSON.stringify([...favorites]))}catch{}render()});h.className='heart';h.setAttribute('aria-label','찜하기');h.setAttribute('aria-pressed',String(favorites.has(d.id)));c.prepend(h);list.append(c)}updateSuggestions();}for(const b of document.querySelectorAll('#tabs button'))b.onclick=()=>{$('#shop').value=b.dataset.filter;for(const x of document.querySelectorAll('#tabs button'))x.setAttribute('aria-pressed',String(x===b));render()};for(const s of ['#search','#shop','#sort'])$(s).oninput=render;load();setInterval(()=>{if(!document.hidden)load()},65000);window.addEventListener('storage',e=>{if(e.key==='hotdealUpdated')load()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});function today(){return new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'})}function applySettings(d){$('#announcement').hidden=!d?.notice;$('#announcement').textContent=d?.notice||'';if(/^#[0-9a-f]{6}$/i.test(d?.color||''))document.documentElement.style.setProperty('--accent',d.color);const last=localGet('hdLastVisit',0);$('#newCount').textContent=last?'지난 방문 이후 신규 '+deals.filter(x=>Date.parse(x.createdAt)>last).length+'개':''; }const visit=Date.now();addEventListener('pagehide',()=>{localSet('hdLastVisit',visit);localSet('hdScroll',scrollY)});function updateSuggestions(){const names=[...new Set([...localGet('hdSearch',[]),...deals.map(d=>d.name)])].slice(0,100);$('#suggestions').replaceChildren(...names.map(n=>{const o=el('option');o.value=n;return o}))}$('#search').addEventListener('change',()=>{const q=$('#search').value.trim();if(q)localSet('hdSearch',[q,...localGet('hdSearch',[]).filter(x=>x!==q)].slice(0,12))});$('#history').onclick=()=>{const q=prompt('최근 검색어: '+localGet('hdSearch',[]).join(', '),'');if(q!==null){$('#search').value=q;render()}};$('#layout').onclick=()=>{const one=$('#list').classList.toggle('one');localSet('hdOne',one);$('#layout').textContent=one?'2열 보기':'1열 보기'};if(localGet('hdOne',false))$('#layout').click();$('#font').onclick=()=>localSet('hdLarge',document.body.classList.toggle('large'));document.body.classList.toggle('large',localGet('hdLarge',false));$('#shopping').onclick=()=>{const ds=deals.filter(d=>favorites.has(d.id)&&d.shop!=='이벤트'&&!d.ended);alert(ds.map(d=>d.name+' · '+money(d.price)).join('\n')+'\n예상 합계 '+money(ds.reduce((a,d)=>a+Number(d.price||0),0)))};$('#shareSite').onclick=async()=>{const url=new URL('./index.html',location.href).href;try{if(navigator.share)await navigator.share({title:'핫딜모아',url});else{await navigator.clipboard.writeText(url);msg('사이트 링크 복사 완료')}}catch(e){if(e.name!=='AbortError')prompt('공유 링크',url)}};$('#top').onclick=()=>scrollTo({top:0,behavior:'smooth'});addEventListener('scroll',()=>$('#top').hidden=scrollY<300);let touchY=null;addEventListener('touchstart',e=>{touchY=scrollY===0?e.touches[0].clientY:null},{passive:true});addEventListener('touchend',e=>{if(touchY!==null&&e.changedTouches[0].clientY-touchY>85){msg('새로고침 중');load().then(()=>{if($('#msg').textContent==='새로고침 중')msg('갱신 완료')})}touchY=null},{passive:true});setTimeout(()=>{$('#splash').hidden=true;scrollTo(0,localGet('hdScroll',0))},700);
