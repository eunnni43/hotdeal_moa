<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>핫딜모아</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f4f6;color:#191f28;font:15px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif}main{max-width:760px;margin:auto;padding:24px 24px 40px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}h1{font-size:27px;letter-spacing:-1.2px;margin:0;font-weight:800}h2{font-size:22px;letter-spacing:-.7px;margin:0 0 8px}button,input,select,textarea{font:inherit;border:0;border-radius:12px;padding:12px 14px;color:inherit;min-width:0}input,select,textarea{background:#f2f4f6}button{cursor:pointer;background:#e8f3ff;color:#1768c5;font-weight:700}button.primary,a.buy{background:#3182f6;color:white}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #3182f6;outline-offset:2px}a.buy{display:block;text-align:center;padding:13px;border-radius:12px;text-decoration:none;font-weight:700;clear:both;margin-top:18px}.hero{margin:24px 0 12px;padding:0}.hero a{color:#1768c5}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}.filters input{flex:1;min-width:140px}.filters input,.filters select{background:white}.grid{display:grid;grid-template-columns:1fr;gap:12px}.card,form{background:white;padding:22px;border-radius:20px}.card h3{margin:8px 0;font-size:17px;line-height:1.55;letter-spacing:-.35px}.card p{margin:7px 0;color:#4e5968;overflow-wrap:anywhere}.pic{width:104px;aspect-ratio:1;object-fit:contain;background:#f2f4f6;border-radius:14px;float:right;margin:0 0 10px 14px}.price{font-size:25px;font-weight:800;letter-spacing:-.8px}.red{color:#f04452}.price small{font-size:13px;font-weight:500;color:#4e5968;letter-spacing:0}small,del{color:#6b7684}form{display:grid;gap:14px;margin:15px 0}label{display:grid;gap:6px;font-weight:600}label input,label textarea,label select{width:100%;font-weight:400}label input[type=checkbox]{width:auto;accent-color:#3182f6}footer{color:#6b7684;margin:24px 0;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}#msg{color:#1768c5;font-size:13px}#msg:empty{display:none}[hidden]{display:none!important}.notice{font-size:12px;color:#596575;line-height:1.65;margin:0 0 12px}.copy{width:100%;margin-top:8px;background:#f2f4f6;color:#4e5968}.empty{padding:30px;text-align:center;color:#6b7684}@media(max-width:480px){main{padding:20px 16px 32px}.card,form{padding:18px}h1{font-size:24px}.filters input{flex-basis:100%}.filters select{flex:1}.pic{width:84px}.price{font-size:23px}}</style><main><header><h1>핫딜모아</h1></header><p class="notice">*본 사이트는 쿠팡 파트너스, 토스 등 제휴 마케팅 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받을 수 있습니다.</p><section class="hero"><h2>핫딜 목록</h2></section><p id="msg" role="status"></p><div class="filters"><input id="search" placeholder="상품 검색"><select id="shop"><option>전체</option><option>쿠팡</option><option>네이버</option><option>토스</option><option>기타</option></select><select id="sort"><option value="new">최신순</option><option value="low">낮은 가격순</option><option value="discount">할인율순</option></select></div><div id="list" class="grid"></div><footer>가격과 할인 혜택은 변경될 수 있습니다. 이 게시물에는 제휴 링크가 포함되어 있으며, 구매 시 운영자가 수수료를 받을 수 있습니다.</footer></main><script>
const $=s=>document.querySelector(s);let deals=[];const msg=s=>$('#msg').textContent=s;const money=n=>Number(n).toLocaleString('ko-KR')+'원';const discount=d=>d.original>d.price?Math.round((1-d.price/d.original)*100):0;const safe=s=>{try{return ['http:','https:'].includes(new URL(s).protocol)}catch{return false}};async function load(){try{const r=await fetch('./deals.json',{cache:'no-store'});if(!r.ok)throw Error('상품 파일을 찾을 수 없습니다');deals=await r.json();render()}catch(e){msg('데이터 연결 실패: '+e.message)}}function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}function button(text,fn){const b=el('button',text);b.onclick=fn;return b}async function copyDeal(d){const notice=d.shop==='쿠팡'?'*이 게시물은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.':'*이 게시물은 제휴 마케팅 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받을 수 있습니다.';const detail=[d.normal?'평소가 '+d.normal:d.original>0?'평소가 '+money(d.original):'',d.comment].filter(Boolean).join(' / ');const text=[notice,'','✅ '+d.name,'👉🏻 '+d.price+'원'+(Number(d.qty)>0?' (개당 '+Math.round(d.price/d.qty)+'원)':''),detail?'└ '+detail:'',d.shipping||'',d.note||'','',d.link].filter((v,i)=>v||i===1).join('\n');try{await navigator.clipboard.writeText(text);msg('복사 완료');}catch{window.prompt('아래 문구를 직접 복사하세요',text)}}function render(){const q=$('#search').value.toLowerCase(),s=$('#shop').value,sort=$('#sort').value;let ds=deals.filter(d=>(s==='전체'||d.shop===s)&&d.name.toLowerCase().includes(q));ds.sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned)||(sort==='low'?a.price-b.price:sort==='discount'?discount(b)-discount(a):0));const list=$('#list');list.replaceChildren();if(!ds.length)list.append(el('p','등록된 상품이 없습니다','empty'));for(const d of ds){const c=el('article',undefined,'card');if(safe(d.image)){const im=el('img',undefined,'pic');im.src=d.image;im.alt=d.name;im.loading='lazy';c.append(im)}c.append(el('small',d.shop+(d.pinned?' · 추천':'')),el('h3','✅ '+d.name));const pr=el('div','👉🏻 '+money(d.price),'price red');if(Number(d.qty)>0)pr.append(el('small',' (개당 '+money(Math.round(d.price/d.qty))+')'));c.append(pr);const detail=[d.normal?'평소가 '+d.normal:d.original>0?'평소가 '+money(d.original):'',d.comment].filter(Boolean).join(' / ');if(detail)c.append(el('p','└ '+detail));if(d.shipping)c.append(el('p',d.shipping));if(d.note)c.append(el('p',d.note));if(d.ended)c.append(el('p','할인 종료','red'));else if(safe(d.link)){const a=el('a','구매하러 가기','buy');a.href=d.link;a.target='_blank';a.rel='noopener noreferrer sponsored';c.append(a);const b=button('복사하기',()=>copyDeal(d));b.className='copy';c.append(b)}list.append(c)}}for(const s of ['#search','#shop','#sort'])$(s).oninput=render;load();</script></html>
